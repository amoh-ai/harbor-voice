[project]
name = "harbor-voice-eva-adapter"
version = "0.1.1"
description = "harbor-voice's adapter for EVA, ServiceNow's voice-agent benchmark."
authors = [{ name = "amoh-ai" }]
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "src/eva_adapter/vendored/LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["voice agents", "speech-to-speech", "evaluation", "benchmark", "harbor", "eva"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# harbor-voice itself is the host environment, not a declared dependency, the
# same arrangement as harbor's own adapters. These are what this adapter adds.
dependencies = [
    # EVA's audio conversions (eva/utils/audio_utils.py) are reproduced byte
    # for byte, so they run on the resampler EVA pins (uv.lock @039efa0a).
    "soxr==1.0.0",
    "audioop-lts>=0.2; python_version >= '3.13'",
]

[project.scripts]
eva-adapter = "eva_adapter.main:main"

[project.urls]
Homepage = "https://github.com/amoh-ai/harbor-voice"
Repository = "https://github.com/amoh-ai/harbor-voice"
Issues = "https://github.com/amoh-ai/harbor-voice/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eva_adapter"]

[tool.hatch.build.targets.sdist]
only-include = ["src/eva_adapter"]

[tool.uv]
package = true
