[project]
name = "harbor-voice-tau-voice-adapter"
version = "0.1.2"
description = "harbor-voice's adapter for τ-Voice, tau3-bench's full-duplex voice benchmark."
authors = [{ name = "amoh-ai" }]
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "src/tau_voice/tau2_audio/LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["voice agents", "speech-to-speech", "evaluation", "benchmark", "harbor", "tau-bench"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# harbor-voice itself is the host environment, not a declared dependency, the
# same arrangement as harbor's own adapters. These are what this adapter adds.
dependencies = [
    # tau2's audio effects are vendored verbatim (tau_voice.tau2_audio); to
    # reproduce its bytes they must run on the same numerics as the tau2 image,
    # which pins these too (sidecar/Dockerfile). Bump both together.
    "numpy==2.5.4",
    "scipy==1.18.1",
    "audioop-lts>=0.2; python_version >= '3.13'",
]

[project.scripts]
tau-voice = "tau_voice.main:main"

[project.urls]
Homepage = "https://github.com/amoh-ai/harbor-voice"
Repository = "https://github.com/amoh-ai/harbor-voice"
Issues = "https://github.com/amoh-ai/harbor-voice/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tau_voice"]

[tool.hatch.build.targets.sdist]
only-include = ["src/tau_voice"]

[tool.uv]
package = true
