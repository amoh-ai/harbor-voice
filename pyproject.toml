[project]
name = "harbor-voice"
version = "0.1.1"
description = "Evaluate voice agents on phone-call benchmarks, on harbor."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "amoh-ai" }]
requires-python = ">=3.12"
keywords = ["voice agents", "speech-to-speech", "evaluation", "benchmark", "harbor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Pinned: harbor-voice uses some of harbor's internal APIs (TrialPaths,
    # EnvironmentConfig, the installed-agent base); a bump is a deliberate step.
    "harbor==0.25.0",
    "numpy>=2.0",
    "websockets>=13.0",
    # litellm.llm (harbor pulls litellm in too). Before 1.108.8 every call
    # with tools imported litellm's MCP proxy code, which needs `mcp`, a
    # package litellm does not install: a cascade failed on its first tool.
    "litellm>=1.108.8",
    # Real G.711 for telephony wire formats (harbor_voice/audio/g711.py).
    # audioop left the stdlib in 3.13; audioop-lts is its maintained port.
    "audioop-lts>=0.2; python_version >= '3.13'",
]

[project.optional-dependencies]
aws = [
    # Bidirectional streaming for Nova Sonic. NOT boto3: boto3's HTTP
    # transport does not do HTTP/2 bidirectional event streams.
    "aws-sdk-bedrock-runtime[awscrt]>=0.0.2",
    "boto3>=1.40",
]
# OpenAI Live over WebRTC (providers/openai/live_webrtc.py); tau2's pin.
live = ["aiortc==1.15.0"]
# Cloud backends are harbor's; these pass its extras through.
daytona = ["harbor[daytona]==0.25.0"]
ec2 = ["harbor[ec2]==0.25.0"]
gke = ["harbor[gke]==0.25.0"]
langsmith = ["harbor[langsmith]==0.25.0"]
modal = ["harbor[modal]==0.25.0"]
prime = ["harbor[prime]==0.25.0"]
sbx = ["harbor[sbx]==0.25.0"]
vercel = ["harbor[vercel]==0.25.0"]
# Gemini Live on Vertex AI: an access token from Application Default
# Credentials. AI Studio needs nothing extra.
google = ["google-auth[requests]>=2.0"]
# The benchmark adapters, released with harbor-voice at the same version.
tau-voice = ["harbor-voice-tau-voice-adapter==0.1.1"]
eva = ["harbor-voice-eva-adapter==0.1.1"]

[project.urls]
Homepage = "https://github.com/amoh-ai/harbor-voice"
Repository = "https://github.com/amoh-ai/harbor-voice"
Issues = "https://github.com/amoh-ai/harbor-voice/issues"

[project.scripts]
harbor-voice = "harbor_voice.cli:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["adapters/tau-voice", "adapters/eva"]

[tool.uv.sources]
harbor-voice-tau-voice-adapter = { workspace = true }
harbor-voice-eva-adapter = { workspace = true }

[dependency-groups]
dev = [
    "harbor-voice[aws,daytona,ec2,gke,google,langsmith,live,modal,prime,sbx,vercel]",
    "harbor-voice-tau-voice-adapter",
    "harbor-voice-eva-adapter",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.15.17,<0.16",
    "ty>=0.0.49,<0.0.50",
]

[tool.ruff]
# Vendored code (tau2's audio effects, EVA's perturbator) stays verbatim; never
# reformatted or linted.
extend-exclude = [
    "adapters/tau-voice/src/tau_voice/tau2_audio/[a-z]*.py",
    "adapters/eva/src/eva_adapter/vendored/[a-z]*.py",
]

[tool.ruff.lint.isort]
known-first-party = ["harbor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers", "--strict-config"]
markers = [
    "asyncio: marks tests as async tests",
    "unit: marks tests as unit tests (fast, no external dependencies)",
    "integration: marks tests as integration tests (requires external services, could be mocked)",
]
asyncio_mode = "auto"

[tool.ty.environment]
python = ".venv"

[tool.ty.rules]
all = "error"

[tool.ty.src]
include = ["src/harbor_voice", "adapters/tau-voice/src", "adapters/eva/src", "scripts"]
exclude = [
    "adapters/tau-voice/src/tau_voice/tau2_audio/[a-z]*.py",
    "adapters/eva/src/eva_adapter/vendored/[a-z]*.py",
]
