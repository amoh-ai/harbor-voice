name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major tags since v8: pin the exact release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check src adapters tests
          uv run ruff format --check src adapters tests
      - name: Types
        run: uv run ty check
      - name: Tests
        run: uv run pytest -q
