name: Release

# Publishes harbor-voice and its two adapters, at one version, when a version
# tag (v0.1.0) is pushed: to PyPI, with a GitHub release for the tag. A manual
# run publishes the same packages to TestPyPI instead. Auth is PyPI trusted
# publishing (OIDC): no token is stored anywhere.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Tests, builds and checks the packages, with no right to publish them.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"

      - name: Test
        run: |
          uv sync --locked
          uv run pytest -q

      - name: Build
        run: uv build --all-packages --out-dir dist

      - name: Check the packages
        run: |
          tag=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=(--tag "$GITHUB_REF_NAME"); fi
          uv run --no-project python scripts/check_dist.py dist "${tag[@]}"
          uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Uploads what the build job made, one package at a time: the adapters
  # first, so harbor-voice's extras resolve once it is up. Files already on
  # the index are skipped, so a failed run can be re-run as is.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Publish
        env:
          UV_PUBLISH_URL: ${{ github.event_name == 'push' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          UV_PUBLISH_CHECK_URL: ${{ github.event_name == 'push' && 'https://pypi.org/simple/' || 'https://test.pypi.org/simple/' }}
        run: |
          for package in harbor_voice_tau_voice_adapter harbor_voice_eva_adapter harbor_voice; do
            uv publish --trusted-publishing always "dist/$package"-*
          done

  github-release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
